<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickClip Universal - Material Reset Password</title>
    <!-- Material Symbols & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Design 3 Theme Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Material 3 Top Navigation Bar -->
    <header class="md3-navbar py-2.5">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between items-center">
            <a class="flex items-center gap-3 text-lg font-medium text-white no-underline" href="/">
                <div class="w-10 h-10 rounded-full bg-purple-500/20 text-purple-300 flex items-center justify-center">
                    <span class="material-symbols-outlined">download_for_offline</span>
                </div>
                <span>QuickClip Universal</span>
            </a>
            
            <div class="flex items-center gap-2">
                <a class="md3-nav-pill" href="/"><span class="material-symbols-outlined text-xl">download</span><span class="hidden sm:inline">Downloader</span></a>
                <a class="md3-nav-pill" href="/audio-cutter"><span class="material-symbols-outlined text-xl">content_cut</span><span class="hidden sm:inline">Audio Cutter</span></a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="md3-card max-w-md w-full p-8 space-y-6">
            <h2 class="text-xl font-medium text-white text-center">Reset Your Password</h2>
            <p class="text-sm text-gray-400 text-center">Enter your new account password below.</p>

            <div id="resetError" class="md3-alert-error hidden"></div>

            <form id="resetForm" onsubmit="event.preventDefault(); resetPassword();" class="space-y-4">
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">New Password</label>
                    <input type="password" id="newPassword" class="md3-text-field" placeholder="••••••••" required>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="md3-text-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="md3-btn-filled w-full py-3 text-base">
                    <span class="material-symbols-outlined text-xl">key</span> Set New Password
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-950 border-t border-gray-800 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 QuickClip Universal. Material Design 3 UI.</p>
    </footer>

    <script>
        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const errorDiv = document.getElementById('resetError');
            
            errorDiv.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            try {
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: newPassword })
                });

                const data = await response.json();
                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Password reset failed.');
                }

                alert('Password reset successful! Please log in with your new password.');
                window.location.href = '/auth';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
