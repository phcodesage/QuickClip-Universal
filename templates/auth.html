<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickClip Universal - Material Authentication</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <!-- Material Symbols & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Design 3 Theme Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Material 3 Top Navigation Bar -->
    <header class="md3-navbar py-2.5">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between items-center">
            <a class="flex items-center gap-3 text-lg font-medium text-white no-underline" href="/">
                <svg class="w-10 h-10 vector-logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="48" height="48" rx="14" fill="url(#auth_logo_bg)"/>
                    <path d="M15 13L35 24L15 35V13Z" fill="white" fill-opacity="0.9"/>
                    <path d="M27 9L17 25H25L21 39L33 21H24L27 9Z" fill="url(#auth_logo_bolt)"/>
                    <defs>
                        <linearGradient id="auth_logo_bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#8B5CF6"/>
                            <stop offset="1" stop-color="#3B82F6"/>
                        </linearGradient>
                        <linearGradient id="auth_logo_bolt" x1="17" y1="9" x2="33" y2="39" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#F59E0B"/>
                            <stop offset="1" stop-color="#EF4444"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="font-medium tracking-wide">QuickClip Universal</span>
            </a>
            
            <div class="flex items-center gap-2">
                <a class="md3-nav-pill" href="/"><span class="material-symbols-outlined text-xl">download</span><span class="hidden sm:inline">Downloader</span></a>
                <a class="md3-nav-pill" href="/audio-cutter"><span class="material-symbols-outlined text-xl">content_cut</span><span class="hidden sm:inline">Audio Cutter</span></a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="md3-card max-w-md w-full p-8 space-y-6">
            <!-- Tabs -->
            <div class="flex border-b border-gray-700 pb-2">
                <button id="loginTabBtn" onclick="switchTab('login')" class="w-1/2 py-2 text-center font-medium text-purple-300 border-b-2 border-purple-300 transition-colors">
                    Login
                </button>
                <button id="signupTabBtn" onclick="switchTab('signup')" class="w-1/2 py-2 text-center font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition-colors">
                    Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="space-y-4">
                <div id="loginError" class="md3-alert-error hidden"></div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Email Address</label>
                    <input type="email" id="loginEmail" class="md3-text-field" placeholder="name@example.com" required>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-gray-300 text-sm font-medium">Password</label>
                        <a href="#" onclick="showForgotPassword()" class="text-xs text-purple-300 hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="loginPassword" class="md3-text-field" placeholder="••••••••" required>
                </div>
                <button onclick="login()" class="md3-btn-filled w-full py-3 text-base">
                    <span class="material-symbols-outlined text-xl">login</span> Log In
                </button>
            </div>

            <!-- Sign Up Form -->
            <div id="signupForm" class="space-y-4 hidden">
                <div id="signupError" class="md3-alert-error hidden"></div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Username</label>
                    <input type="text" id="signupUsername" class="md3-text-field" placeholder="username" required>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Email Address</label>
                    <input type="email" id="signupEmail" class="md3-text-field" placeholder="name@example.com" required>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Password</label>
                    <input type="password" id="signupPassword" class="md3-text-field" placeholder="••••••••" required>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" class="md3-text-field" placeholder="••••••••" required>
                </div>
                <button onclick="signup()" class="md3-btn-filled w-full py-3 text-base">
                    <span class="material-symbols-outlined text-xl">person_add</span> Create Account
                </button>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgotPasswordForm" class="space-y-4 hidden">
                <h3 class="text-lg font-medium text-white text-center">Reset Password</h3>
                <div id="forgotError" class="md3-alert-error hidden"></div>
                <div id="forgotSuccess" class="md3-alert-success hidden"></div>
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Email Address</label>
                    <input type="email" id="forgotEmail" class="md3-text-field" placeholder="name@example.com">
                </div>
                <button onclick="requestPasswordReset()" class="md3-btn-filled w-full py-3 text-base">
                    <span class="material-symbols-outlined text-xl">send</span> Send Reset Link
                </button>
                <div class="text-center">
                    <button onclick="showLoginForm()" class="text-sm text-purple-300 hover:underline">Back to Login</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-950 border-t border-gray-800 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 QuickClip Universal. Material Design 3 UI.</p>
    </footer>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const forgotForm = document.getElementById('forgotPasswordForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');

            forgotForm.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTabBtn.className = 'w-1/2 py-2 text-center font-medium text-purple-300 border-b-2 border-purple-300 transition-colors';
                signupTabBtn.className = 'w-1/2 py-2 text-center font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition-colors';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupTabBtn.className = 'w-1/2 py-2 text-center font-medium text-purple-300 border-b-2 border-purple-300 transition-colors';
                loginTabBtn.className = 'w-1/2 py-2 text-center font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition-colors';
            }
        }

        function showForgotPassword() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('forgotPasswordForm').classList.remove('hidden');
        }

        function showLoginForm() {
            switchTab('login');
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Login failed.');
                }

                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                window.location.href = '/profile';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            }
        }

        async function signup() {
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const confirmPassword = document.getElementById('signupConfirmPassword').value.trim();
            const errorDiv = document.getElementById('signupError');

            errorDiv.classList.add('hidden');

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Registration failed.');
                }

                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                window.location.href = '/profile';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            }
        }

        async function requestPasswordReset() {
            const email = document.getElementById('forgotEmail').value.trim();
            const errorDiv = document.getElementById('forgotError');
            const successDiv = document.getElementById('forgotSuccess');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Password reset failed.');
                }

                if (data.reset_url) {
                    successDiv.innerHTML = `Password reset URL generated: <a href="${data.reset_url}" class="underline font-bold">Reset Link</a>`;
                } else {
                    successDiv.textContent = 'Password reset link sent to your email.';
                }
                successDiv.classList.remove('hidden');
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
